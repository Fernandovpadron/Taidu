<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taidu Selling Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app">

```
    <!-- ENCABEZADO -->
    <header class="header">
        <div class="logo">
            Taidu Selling Intelligence
        </div>

        <div class="status">
            ● En línea
        </div>
    </header>

    <!-- CONVERSACIÓN -->
    <main class="conversation">
        <div class="question">
            <div class="avatar ai-avatar">
                Taidu
            </div>

            <div class="message ai-message">
                <div class="message-label">
                    Taidu Selling Intelligence
                </div>

                <div class="message-text">
                    Para comenzar, ¿cuál es tu correo electrónico?
                </div>
            </div>
        </div>

        <!-- AQUÍ APARECERÁN LAS RESPUESTAS -->
        <div id="messages"></div>
    </main>

    <!-- ÁREA DE RESPUESTA -->
    <footer class="input-area">
        <div class="input-container">
            <textarea
                id="answerInput"
                placeholder="Escribe tu respuesta..."
                rows="1"
                autofocus
            ></textarea>

            <button
                id="micButton"
                class="icon-button"
                title="Responder por voz"
            >
                🎤
            </button>

            <button
                id="sendButton"
                class="send-button"
                title="Enviar"
            >
                ➤
            </button>
        </div>

        <div class="hint">
            Puedes escribir tu respuesta o utilizar el micrófono.
        </div>

```

<script>
    const input = document.getElementById("answerInput");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");
    const micButton = document.getElementById("micButton");

    // ------------------------------------------------
    // ESTADO DE LA CONVERSACIÓN
    // ------------------------------------------------

    let usuarioIdentificado = false;
    let datosUsuario = null;

    // Etapas iniciales del login:
    // "email"      = solicitando correo
    // "password"   = solicitando contraseña
    // "conversacion" = usuario autenticado
    let etapaLogin = "email";

    // ------------------------------------------------
    // ENVIAR RESPUESTA
    // ------------------------------------------------

    async function enviarRespuesta() {
        const respuesta = input.value.trim();

        if (!respuesta) {
            return;
        }

        // ------------------------------------------------
        // LOGIN
        // ------------------------------------------------

        if (!usuarioIdentificado) {

            // --------------------------------------------
            // PRIMER PASO: CORREO
            // --------------------------------------------

            if (etapaLogin === "email") {
                agregarMensajeUsuario(respuesta);

                input.value = "";

                // Guardamos temporalmente el correo
                datosUsuario = {
                    email: respuesta
                };

                etapaLogin = "password";

                // Convertir el campo en password
                input.type = "password";
                input.placeholder = "Escribe tu contraseña...";

                agregarMensajeAI(
                    "Ahora escribe tu contraseña."
                );

                input.focus();

                return;
            }

            // --------------------------------------------
            // SEGUNDO PASO: CONTRASEÑA
            // --------------------------------------------

            if (etapaLogin === "password") {
                const password = respuesta;

                input.value = "";

                await identificarUsuario(
                    datosUsuario.email,
                    password
                );

                return;
            }
        }

        // ------------------------------------------------
        // USUARIO YA IDENTIFICADO
        // ------------------------------------------------

        agregarMensajeUsuario(respuesta);

        input.value = "";

        try {
            const response = await fetch("/answer", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    respuesta: respuesta
                })
            });

            const data = await response.json();

            console.log("Respuesta del servidor:", data);

            if (!data.ok) {
                agregarMensajeAI(data.mensaje);
                return;
            }

            // Por ahora simplemente mostramos
            // la respuesta del servidor.
            agregarMensajeAI(
                "Mucho gusto, " + data.respuesta + "."
            );

        } catch (error) {
            console.error(error);

            agregarMensajeAI(
                "No fue posible comunicarse con el servidor."
            );
        }
    }

    // ------------------------------------------------
    // IDENTIFICAR Y AUTENTICAR USUARIO
    // ------------------------------------------------

    async function identificarUsuario(email, password) {
        try {
            const response = await fetch("/identify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            console.log("Autenticación:", data);

            if (!data.ok) {
                agregarMensajeAI(data.mensaje);

                // Si la autenticación falló,
                // seguimos solicitando la contraseña.
                etapaLogin = "password";

                input.type = "password";
                input.placeholder = "Escribe tu contraseña...";
                input.focus();

                return;
            }

            // ------------------------------------------------
            // USUARIO AUTENTICADO CORRECTAMENTE
            // ------------------------------------------------

            usuarioIdentificado = true;
            datosUsuario = data;

            // Cambiar nuevamente el campo a texto normal
            input.type = "text";
            input.placeholder = "Escribe tu respuesta...";

            console.log(
                "Usuario identificado:",
                datosUsuario.usuario
            );

            console.log(
                "Perfil:",
                datosUsuario.perfil
            );

            // ------------------------------------------------
            // DETERMINAR PRIMERA PREGUNTA SEGÚN EL PERFIL
            // ------------------------------------------------

            if (data.flujo === "vendedor") {
                agregarMensajeAI(
                    "Hola! Soy tu comprador.\n\n¿Cómo debo llamarte?"
                );

            } else if (data.flujo === "director_comercial") {
                agregarMensajeAI(
                    "Muchas gracias por conectarte.\n\nIniciaremos con la configuración.\n\n¿Cómo debo llamarte?"
                );

            } else if (data.flujo === "administrador") {
                agregarMensajeAI(
                    "Bienvenido. ¿Qué deseas administrar?"
                );

            } else {
                agregarMensajeAI(
                    "Tu perfil fue identificado, pero todavía no tiene un flujo configurado."
                );
            }

        } catch (error) {
            console.error(error);

            agregarMensajeAI(
                "No fue posible comunicarse con el servidor."
            );
        }
    }

    // ------------------------------------------------
    // MOSTRAR MENSAJE DEL USUARIO
    // ------------------------------------------------

    function agregarMensajeUsuario(texto) {
        const container = document.createElement("div");

        container.className = "user-message-container";

        container.innerHTML = `
            <div class="message user-message">
                ${escapeHtml(texto)}
            </div>
        `;

        messages.appendChild(container);
        scrollBottom();
    }

    // ------------------------------------------------
    // MOSTRAR MENSAJE DE TAIDU
    // ------------------------------------------------

    function agregarMensajeAI(texto) {
        const container = document.createElement("div");

        container.className = "question";

        container.innerHTML = `
            <div class="avatar ai-avatar">
                Taidu
            </div>

            <div class="message ai-message">
                <div class="message-label">
                    Taidu Selling Intelligence
                </div>

                <div class="message-text">
                    ${escapeHtml(texto)}
                </div>
            </div>
        `;

        messages.appendChild(container);
        scrollBottom();
    }

    // ------------------------------------------------
    // ENTER = ENVIAR
    // SHIFT + ENTER = NUEVA LÍNEA
    // ------------------------------------------------

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            enviarRespuesta();
        }
    });

    sendButton.addEventListener("click", enviarRespuesta);

    // ------------------------------------------------
    // MICRÓFONO
    // ------------------------------------------------

    micButton.addEventListener("click", function() {
        alert(
            "El micrófono lo conectaremos en el siguiente paso con faster-whisper."
        );
    });

    // ------------------------------------------------
    // SEGURIDAD BÁSICA
    // ------------------------------------------------

    function escapeHtml(text) {
        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    // ------------------------------------------------
    // SCROLL
    // ------------------------------------------------

    function scrollBottom() {
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }
</script>

</body>
</html>
